<!doctype html>
<html><head><meta charset="utf-8">
<style>html, body { margin: 0; } svg { display: block; }</style></head>
<body>
<svg id="art" width="1600" height="1200" viewBox="0 0 1600 1200"></svg>
<script>
// Flat, side-view motorcycle illustrations for demo unit photos (4:3).
// window.draw({ type: 'matic'|'maxi'|'bebek'|'sport', body, accent, seat, bg, variant })
const wheel = (cx, cy, r, rim = '#c9ced6') => `
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="#1b1d22"/>
  <circle cx="${cx}" cy="${cy}" r="${r * 0.62}" fill="#2b2f37"/>
  ${Array.from({ length: 5 }, (_, i) => { const a = i * 72 * Math.PI / 180; return `<path d="M${cx} ${cy} L${cx + Math.cos(a) * r * 0.58} ${cy + Math.sin(a) * r * 0.58}" stroke="${rim}" stroke-width="${r * 0.13}" stroke-linecap="round"/>`; }).join('')}
  <circle cx="${cx}" cy="${cy}" r="${r * 0.16}" fill="${rim}"/>`;
const disc = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r * 0.42}" fill="none" stroke="#9aa1ab" stroke-width="10" opacity=".8"/>`;

function matic(o, maxi) {
  const s = maxi ? 1.08 : 1;
  return `<g transform="translate(800 690) scale(${s}) translate(-800 -690)">
    ${wheel(470, 840, 150)}${wheel(1150, 840, 150)}${disc(1150, 840, 150)}
    <path d="M1150 840 L1060 520" stroke="#3a3f48" stroke-width="34" stroke-linecap="round"/>
    <path d="M330 700 Q330 590 450 575 L760 560 Q820 556 850 600 L900 690 Q930 735 980 720 L1050 520 Q1080 430 1150 420 L1190 418 Q1220 420 1215 455 L1150 690 Q1120 790 1010 790 L600 790 Q450 790 380 760 Q330 740 330 700Z" fill="${o.body}" stroke="#1b1d22" stroke-width="9" stroke-linejoin="round"/>
    <path d="M560 790 L980 790 L1000 720 L900 690 L560 720Z" fill="${o.accent}" opacity=".9"/>
    <path d="M380 590 Q420 520 520 520 L790 520 Q850 520 860 560 L860 580 L420 600 Q380 604 380 590Z" fill="${o.seat}"/>
    <path d="M1100 430 L1120 330 L1180 320" stroke="#2b2f37" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M1150 330 L1250 310" stroke="#2b2f37" stroke-width="22" stroke-linecap="round"/>
    <path d="M1190 430 Q1235 430 1238 470 L1222 520 Q1200 500 1180 470Z" fill="#fff6c8" stroke="#2b2f37" stroke-width="8"/>
    <path d="M340 640 L300 646 Q290 676 320 680 L348 676Z" fill="#e0453a"/>
    <path d="M620 790 Q600 860 640 870 L800 870 Q840 860 830 790Z" fill="#3a3f48"/>
    <path d="M450 610 Q620 600 830 590" stroke="rgba(255,255,255,.25)" stroke-width="14" stroke-linecap="round" fill="none"/>
    ${maxi ? `<path d="M930 600 Q980 560 1060 545" stroke="rgba(255,255,255,.3)" stroke-width="12" stroke-linecap="round" fill="none"/>` : ''}
  </g>`;
}
function bebek(o) {
  return `
    ${wheel(480, 840, 140)}${wheel(1140, 840, 140)}${disc(1140, 840, 140)}
    <path d="M1140 840 L1050 520" stroke="#3a3f48" stroke-width="30" stroke-linecap="round"/>
    <path d="M480 840 L700 760" stroke="#3a3f48" stroke-width="34" stroke-linecap="round"/>
    <path d="M360 640 Q370 590 450 580 L800 570 Q860 570 880 600 L920 640 L700 700 L420 690 Q360 680 360 640Z" fill="${o.body}" stroke="#1b1d22" stroke-width="9" stroke-linejoin="round"/>
    <path d="M880 600 Q950 520 1050 470 L1110 450 Q1150 450 1140 490 L1080 650 Q1010 690 930 690 L800 700 Z" fill="${o.accent}" stroke="#1b1d22" stroke-width="9" stroke-linejoin="round"/>
    <path d="M700 700 L930 690 L920 760 Q860 800 760 800 L690 790Z" fill="#2b2f37"/>
    <circle cx="780" cy="760" r="48" fill="#4a505a"/><circle cx="780" cy="760" r="22" fill="#9aa1ab"/>
    <path d="M420 580 Q450 520 540 520 L820 520 Q870 524 870 570 L430 590Z" fill="${o.seat}"/>
    <path d="M1080 450 L1100 360 L1160 350" stroke="#2b2f37" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M1130 360 L1230 340" stroke="#2b2f37" stroke-width="20" stroke-linecap="round"/>
    <path d="M1140 460 Q1190 460 1192 500 L1176 540 Q1150 520 1130 490Z" fill="#fff6c8" stroke="#2b2f37" stroke-width="8"/>
    <path d="M520 760 L360 780" stroke="#9aa1ab" stroke-width="26" stroke-linecap="round"/>
    <path d="M370 620 L330 626 Q322 652 350 656 L376 652Z" fill="#e0453a"/>`;
}
function sport(o) {
  return `
    <path d="M470 840 L780 730" stroke="#2b2f37" stroke-width="38" stroke-linecap="round"/>
    ${wheel(470, 840, 155)}${wheel(1160, 840, 155)}${disc(1160, 840, 155)}${disc(470, 840, 155)}
    <path d="M1160 840 L1075 520" stroke="#c9a227" stroke-width="30" stroke-linecap="round"/>
    <path d="M690 640 L740 760 L900 760 L930 640 Z" fill="#3a3f48" stroke="#1b1d22" stroke-width="8" stroke-linejoin="round"/>
    <path d="M300 520 L560 560 Q620 500 720 490 L860 486 Q940 486 990 470 L1080 430 Q1150 418 1185 470 L1215 560 Q1220 610 1180 640 L1060 720 Q990 760 900 770 L860 690 L940 640 L700 650 L560 600 L330 560 Q296 548 300 520Z"
      fill="${o.body}" stroke="#1b1d22" stroke-width="9" stroke-linejoin="round"/>
    <path d="M960 600 L1200 575 Q1205 615 1170 640 L1060 712 Q995 750 920 758 L900 700 Z" fill="${o.accent}"/>
    <path d="M560 560 Q620 515 700 512 L760 512 L720 560 Z" fill="${o.seat}" stroke="#1b1d22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M1080 430 L1140 380 Q1165 372 1172 400 L1182 462 Q1150 440 1100 445Z" fill="rgba(170,210,240,.75)" stroke="#1b1d22" stroke-width="7" stroke-linejoin="round"/>
    <path d="M1170 540 L1220 548 Q1224 576 1200 582 L1172 572Z" fill="#fff6c8" stroke="#1b1d22" stroke-width="6"/>
    <path d="M760 740 L560 770 Q520 776 524 806 L720 796 Z" fill="#6a717c" stroke="#1b1d22" stroke-width="6" stroke-linejoin="round"/>
    <path d="M308 528 L290 530 Q286 548 304 550Z" fill="#e0453a"/>
    <path d="M620 590 Q780 575 960 545" stroke="rgba(255,255,255,.3)" stroke-width="14" stroke-linecap="round" fill="none"/>`;
}

window.draw = (o) => {
  const bike = o.type === 'sport' ? sport(o) : o.type === 'bebek' ? bebek(o) : matic(o, o.type === 'maxi');
  document.getElementById('art').innerHTML = `
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.bg}"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
      <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e6e1"/><stop offset="1" stop-color="#d9d4cd"/></linearGradient>
      <radialGradient id="spot" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1600" height="1200" fill="url(#wall)"/>
    <rect y="900" width="1600" height="300" fill="url(#floor)"/>
    <ellipse cx="800" cy="520" rx="760" ry="440" fill="url(#spot)"/>
    ${[0, 1, 2, 3].map((i) => `<rect x="${120 + i * 380}" y="80" width="220" height="12" rx="6" fill="#fff" opacity=".7"/>`).join('')}
    <ellipse cx="810" cy="995" rx="560" ry="40" fill="rgba(30,30,30,.22)"/>
    <g transform="translate(800 980) scale(1.14) translate(-800 -990)">${bike}</g>`;
};

// A dashboard close-up for used units' "odometer" photo.
window.drawOdo = (km, bg) => {
  const digits = String(km).padStart(6, '0');
  document.getElementById('art').innerHTML = `
    <rect width="1600" height="1200" fill="${bg}"/>
    <rect x="200" y="200" width="1200" height="800" rx="160" fill="#1b1d22"/>
    <rect x="260" y="260" width="1080" height="680" rx="120" fill="#0f2a33"/>
    <path d="M420 760 A380 380 0 0 1 1180 760" fill="none" stroke="#26505c" stroke-width="40" stroke-linecap="round"/>
    <path d="M420 760 A380 380 0 0 1 940 410" fill="none" stroke="#7fe0ff" stroke-width="40" stroke-linecap="round"/>
    ${Array.from({ length: 6 }, (_, i) => `<rect x="${560 + i * 82}" y="800" width="70" height="104" rx="10" fill="#0a1a20"/><text x="${595 + i * 82}" y="878" font-family="monospace" font-size="72" font-weight="700" fill="#cfe9f1" text-anchor="middle">${digits[i]}</text>`).join('')}
    <text x="1080" y="878" font-family="sans-serif" font-size="44" font-weight="700" fill="#7fb7c6">km</text>
    <text x="800" y="640" font-family="sans-serif" font-size="150" font-weight="800" fill="#e7f6fb" text-anchor="middle">0</text>
    <text x="800" y="700" font-family="sans-serif" font-size="40" font-weight="600" fill="#7fb7c6" text-anchor="middle">km/h</text>`;
};
</script>
</body></html>
