<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Linea.js — penutup video & watermark</title>
<style>
@font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/poppins-600-latin.woff2) format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/poppins-700-latin.woff2) format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 800; src: url(fonts/poppins-800-latin.woff2) format('woff2'); }
:root { --blue: #2231f6; --navy: #0d208d; --ink: #0b1b3f; --muted: #5b6685; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased; }

/* ---------- Closing animation ---------- */
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
body.v #stage { width: 1080px; height: 1920px; }
#glow { position: absolute; inset: 0; background: radial-gradient(42% 42% at 50% 46%, rgba(34,49,246,.12), transparent 70%); }
#grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(34,49,246,.14) 2px, transparent 2.5px); background-size: 46px 46px; -webkit-mask-image: radial-gradient(50% 50% at 50% 50%, #000, transparent 75%); mask-image: radial-gradient(50% 50% at 50% 50%, #000, transparent 75%); }
#wipe { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; background: var(--blue); }
#lockup { position: absolute; left: 0; right: 0; top: 50%; text-align: center; transform: translateY(-50%); }
#mark { position: relative; width: 300px; height: 285px; margin: 0 auto 18px; }
#mark img { position: absolute; inset: 0; width: 100%; height: 100%; }
#ring { position: absolute; left: 50%; top: 50%; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; border: 6px solid rgba(34,49,246,.35); }
#name { font-size: 112px; font-weight: 700; letter-spacing: -.03em; color: var(--navy); line-height: 1; }
#name span { display: inline-block; }
#line { width: 0; height: 6px; margin: 28px auto 0; border-radius: 3px; background: linear-gradient(90deg, var(--blue), #68c4ff); }
body.v #mark { width: 360px; height: 342px; }
body.v #name { font-size: 128px; }

/* ---------- Corner watermark (rendered once as a transparent PNG) ---------- */
body.wm #stage { display: none; }
#wm { display: none; align-items: center; gap: 12px; padding: 9px 22px 9px 12px; border-radius: 999px; background: rgba(255,255,255,.88); box-shadow: 0 6px 18px -6px rgba(11,27,63,.35); border: 1.5px solid rgba(13,32,141,.12); width: max-content; }
body.wm #wm { display: inline-flex; }
#wm img { width: 46px; height: 44px; }
#wm b { font-size: 27px; font-weight: 700; color: var(--navy); letter-spacing: -.02em; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div id="lockup">
    <div id="mark"><div id="ring"></div><img src="assets/linea-mark.png" alt=""></div>
    <div id="name"></div>
    <div id="line"></div>
  </div>
  <div id="wipe"></div>
</div>
<div id="wm"><img src="assets/linea-mark.png" alt=""><b>Linea.js</b></div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>window.gsap || document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"><\/script>');</script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('f') === 'v') document.body.classList.add('v');
if (params.has('wm')) document.body.classList.add('wm');
const $ = (s) => document.querySelector(s);
$('#name').innerHTML = [...'Linea.js'].map((c) => `<span>${c}</span>`).join('');

gsap.defaults({ ease: 'power3.out' });
const tl = gsap.timeline({ paused: true });
gsap.set('#wipe', { scale: 0 });
gsap.set('#mark img', { scale: .3, rotation: -120, opacity: 0, clipPath: 'circle(0% at 50% 50%)' });
gsap.set('#ring', { scale: .4, opacity: 0 });
gsap.set('#name span', { yPercent: 120, opacity: 0 });
gsap.set('#glow, #grid', { opacity: 0 });

// The blue circle sweeps in from the previous scene and clears to white
tl.fromTo('#wipe', { scale: 14 }, { scale: 0, duration: .55, ease: 'power3.in' }, 0)
  .to('#glow, #grid', { opacity: 1, duration: .8 }, .2)
  .to('#mark img', { scale: 1, rotation: 0, opacity: 1, clipPath: 'circle(75% at 50% 50%)', duration: 1.0, ease: 'back.out(1.5)' }, .35)
  .to('#ring', { scale: 1.25, opacity: 1, duration: .25, ease: 'power2.out' }, 1.05)
  .to('#ring', { scale: 1.6, opacity: 0, duration: .7, ease: 'power2.out' }, 1.3)
  .to('#name span', { yPercent: 0, opacity: 1, duration: .6, stagger: .05, ease: 'back.out(1.8)' }, .95)
  .to('#line', { width: 260, duration: .7, ease: 'power2.inOut' }, 1.5)
  .to('#mark', { y: -8, duration: .9, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 1.9)
  .to('#lockup', { opacity: 0, scale: .97, duration: .45, ease: 'power2.in' }, 3.1)
  .to({}, { duration: .01 }, 3.6);

window.DURATION = 3.6;
window.seek = (t) => { tl.seek(t, false); };
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]);
if (!params.has('render') && !params.has('wm')) { tl.play(0); tl.eventCallback('onComplete', () => setTimeout(() => tl.play(0), 600)); }
</script>
</body>
</html>
