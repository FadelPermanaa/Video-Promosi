<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Linea.js — story Instagram</title>
<style>
@font-face { font-family: 'Poppins'; font-weight: 400; src: url(fonts/poppins-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 500; src: url(fonts/poppins-500-latin.woff2) format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 600; src: url(fonts/poppins-600-latin.woff2) format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 700; src: url(fonts/poppins-700-latin.woff2) format('woff2'); }
@font-face { font-family: 'Poppins'; font-weight: 800; src: url(fonts/poppins-800-latin.woff2) format('woff2'); }
:root { --blue: #2231f6; --navy: #0d208d; --sky: #68c4ff; --mist: #f2f5ff; --amber: #ffb423; --ink: #0b1440; --muted: #56618a; --line: #dfe4fb; --ok: #12a05c; --bad: #e0384d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: 'Poppins', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--mist); }
#darkbg { position: absolute; inset: 0; background: var(--navy); opacity: 0; }
#darkbg .dgrid { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.08) 2px, transparent 2.5px); background-size: 48px 48px; }
#darkbg .dglow { position: absolute; inset: 0; background: radial-gradient(60% 40% at 90% 10%, rgba(104,196,255,.25), transparent 70%), radial-gradient(60% 45% at 0% 100%, rgba(34,49,246,.6), transparent 70%); }
#darkbg path { fill: none; stroke: var(--sky); stroke-width: 5; stroke-linecap: round; opacity: .3; }
.scene { position: absolute; inset: 0; visibility: hidden; }
.scene.dark { color: #fff; }
#sweep { position: absolute; left: -760px; top: 0; width: 2600px; height: 1500px; transform: rotate(-14deg); visibility: hidden; z-index: 40; }
#sweep .band { position: absolute; inset: 0; background: var(--blue); border-radius: 120px; }
#sweep .edge { position: absolute; left: 0; right: 0; height: 26px; border-radius: 13px; background: var(--amber); }
#sweep .edge.a { top: -70px; } #sweep .edge.b { bottom: -70px; background: var(--sky); }
#sweep img { position: absolute; left: 50%; top: 50%; width: 220px; margin: -105px 0 0 -110px; transform: rotate(14deg); filter: brightness(0) invert(1); opacity: .9; }
#wm { position: absolute; right: 60px; top: 270px; width: 212px; z-index: 30; }
#endbg { position: absolute; inset: 0; background: #fff; visibility: hidden; z-index: 35; }
#end { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; z-index: 36; visibility: hidden; }
#end .emark { position: relative; width: 360px; height: 342px; margin: 0 auto 18px; }
#end .emark img { position: absolute; inset: 0; width: 100%; height: 100%; }
#end .ering { position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; border: 6px solid rgba(34,49,246,.35); }
#end .ename { font-size: 128px; font-weight: 700; letter-spacing: -.03em; color: var(--navy); line-height: 1; }
#end .ename span { display: inline-block; }
#end .eline { width: 0; height: 6px; margin: 28px auto 0; border-radius: 3px; background: linear-gradient(90deg, var(--blue), var(--sky)); }
#end .eglow { position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(34,49,246,.12), transparent); }
#tag .cnt { display: inline-block; height: 1.2em; overflow: hidden; vertical-align: -.25em; }
#tag .roll { display: block; }
#tag .cnt b { display: block; font-weight: 600; color: var(--muted); line-height: 1.2em; }
.abs { position: absolute; }
#grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(34,49,246,.13) 2px, transparent 2.5px); background-size: 48px 48px; }
#glow { position: absolute; inset: 0; background: radial-gradient(60% 40% at 90% 10%, rgba(104,196,255,.35), transparent 70%), radial-gradient(50% 35% at 0% 100%, rgba(34,49,246,.16), transparent 70%); }
#flow { position: absolute; inset: 0; }
#flow path { fill: none; stroke: var(--blue); stroke-width: 5; stroke-linecap: round; opacity: .22; }

/* label top-left, inside the safe zone (watermark sits top-right) */
#tag { z-index: 30; left: 70px; top: 284px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px 12px 14px; border-radius: 999px; background: #fff; font-size: 26px; font-weight: 700; color: var(--navy); box-shadow: 0 10px 30px -14px rgba(13,32,141,.45); }
#tag i { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; }
#tag span { color: var(--muted); font-weight: 600; }

#text { left: 70px; right: 70px; top: 420px; }
#text .eyebrow { display: inline-block; font-size: 30px; font-weight: 700; letter-spacing: .14em; color: var(--blue); margin-bottom: 18px; }
#text h1 { font-size: 92px; line-height: 1.04; letter-spacing: -.04em; font-weight: 800; }
#text h1 em { font-style: normal; color: var(--blue); }
.dark #text h1 em { color: var(--amber); }
#text p { font-size: 44px; line-height: 1.32; color: var(--muted); margin-top: 26px; font-weight: 500; }
.dark #text p { color: #c9d2ff; }
.line-wrap { display: block; overflow: hidden; padding-bottom: .06em; }
.line-wrap > span { display: inline-block; }
#art { left: 70px; right: 70px; top: 1010px; height: 560px; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.chip { padding: 12px 26px; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-size: 30px; font-weight: 600; color: var(--navy); }
.chip.amber { background: var(--amber); border-color: var(--amber); color: var(--ink); }

/* icon tile */
.ic { display: grid; place-items: center; border-radius: 36%; background: var(--blue); color: #fff; }
.ic svg { width: 56%; height: 56%; }
.ic.soft { background: #fff; color: var(--blue); border: 3px solid var(--line); }

/* logo */
#mark { left: 50%; top: 520px; width: 420px; height: 400px; margin-left: -210px; }
#mark img { width: 100%; height: 100%; }
.t-logo #text { top: 1040px; text-align: center; }

/* chain */
.node { position: absolute; top: 70px; width: 270px; text-align: center; }
.node .ic { width: 200px; height: 200px; margin: 0 auto 20px; }
.node b { font-size: 36px; font-weight: 700; }
#chainline { position: absolute; left: 0; top: 0; width: 940px; height: 400px; }

/* list (crossed) */
.row { display: flex; align-items: center; gap: 28px; padding: 30px 34px; margin-bottom: 22px; border-radius: 30px; background: #fff; box-shadow: 0 20px 40px -26px rgba(13,32,141,.4); font-size: 40px; font-weight: 700; }
.row .ic { flex: none; width: 92px; height: 92px; }

/* stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
.stat { padding: 34px 34px 30px; border-radius: 34px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.14); min-height: 250px; }
.stat b { display: block; font-size: 104px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: #fff; }
.stat:first-child b { color: var(--amber); }
.stat span { display: block; margin-top: 16px; font-size: 32px; color: #c9d2ff; font-weight: 500; line-height: 1.25; }
.t-stats #art { top: 960px; height: 620px; }

/* intro cards */
.card { display: flex; align-items: center; gap: 26px; padding: 18px 26px 18px 18px; margin-bottom: 18px; border-radius: 28px; background: #fff; font-size: 40px; font-weight: 700; box-shadow: 0 20px 40px -26px rgba(13,32,141,.4); }
.card .ic { flex: none; width: 80px; height: 80px; }
.card em { margin-left: auto; font-style: normal; font-size: 30px; color: var(--blue); }

/* service */
.big-n { position: absolute; right: 60px; top: 360px; font-size: 300px; font-weight: 800; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 4px rgba(34,49,246,.22); line-height: 1; }
#sv-icon { left: 50%; top: 1080px; width: 360px; height: 360px; margin-left: -180px; }
#sv-icon .ic { width: 100%; height: 100%; border-radius: 34%; box-shadow: 0 40px 80px -30px rgba(34,49,246,.7); }
#sv-ring { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; border: 4px dashed rgba(34,49,246,.3); }
.t-service #text h1 { font-size: 100px; }

/* project mock-ups */
#device { left: 70px; right: 70px; top: 400px; height: 600px; border-radius: 36px; background: #fff; box-shadow: 0 50px 90px -40px rgba(13,32,141,.55); overflow: hidden; border: 3px solid #e5e9fb; }
#device .bar { height: 64px; background: var(--navy); display: flex; align-items: center; gap: 12px; padding: 0 28px; color: #fff; font-size: 26px; font-weight: 700; }
#device .bar i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.4); }
#device .bar b { margin-left: 12px; }
#device .body { position: relative; padding: 26px 28px; font-size: 26px; }
.note-ill { position: absolute; right: 90px; top: 1012px; font-size: 22px; color: var(--muted); font-weight: 500; }
.t-project #text { top: 1050px; }
.t-project #text h1 { font-size: 84px; }
.t-project #text p { font-size: 38px; margin-top: 16px; }
.t-project .chips { margin-top: 22px; }
.t-project .chip { font-size: 26px; padding: 10px 22px; }
.kind { display: inline-block; padding: 10px 22px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 26px; font-weight: 700; margin-bottom: 16px; }
.slots { display: grid; grid-template-columns: 110px repeat(4, 1fr); gap: 10px; }
.slots div { height: 66px; border-radius: 14px; background: #eef1ff; display: grid; place-items: center; font-weight: 600; color: var(--muted); font-size: 22px; }
.slots .h { background: none; justify-content: start; }
.slots .bk { background: var(--blue); color: #fff; }
.slots .sel { background: var(--amber); color: var(--ink); }
.mrow { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 2px dashed #e5e9fb; font-weight: 600; }
.mrow small { color: var(--muted); font-weight: 500; }
.alert { margin-top: 16px; padding: 18px 22px; border-radius: 18px; background: #fdecee; color: #a01b2d; font-weight: 700; display: flex; gap: 14px; align-items: center; }
.alert.amber { background: #fff4dc; color: #7a4f00; }
.okbar { margin-top: 16px; display: flex; gap: 14px; }
.okbar span { padding: 10px 18px; border-radius: 12px; background: #eef1ff; color: var(--navy); font-weight: 700; font-size: 22px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tile { padding: 20px 22px; border-radius: 20px; background: #f4f6ff; }
.tile small { display: block; color: var(--muted); font-weight: 500; }
.tile b { font-size: 46px; letter-spacing: -.03em; }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 10px; }
.bars i { flex: 1; background: var(--sky); border-radius: 8px 8px 0 0; }
.bars i.hl { background: var(--amber); }
.stepper { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
.stepper span { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #eef1ff; font-weight: 800; color: var(--muted); }
.stepper span.on { background: var(--blue); color: #fff; }
.stepper i { flex: 1; height: 6px; border-radius: 3px; background: #eef1ff; }
.stepper i.on { background: var(--blue); }
.prod { display: flex; gap: 22px; align-items: center; padding: 20px; border-radius: 22px; background: #f4f6ff; }
.prod .pic { width: 120px; height: 120px; border-radius: 22px; background: linear-gradient(135deg, #6b3b1f, #a8673a); position: relative; }
.prod .pic::after { content: ''; position: absolute; inset: 26px; border-radius: 10px; border: 6px dashed rgba(255,255,255,.35); }
.cap { margin-top: 22px; }
.cap .track { height: 22px; border-radius: 11px; background: #eef1ff; overflow: hidden; }
.cap .track i { display: block; height: 100%; width: 70%; background: var(--blue); border-radius: 11px; }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }
.moto { padding: 16px; border-radius: 20px; background: #f4f6ff; font-weight: 700; position: relative; }
.moto svg { width: 100%; height: 110px; color: var(--navy); }
.moto small { display: block; color: var(--muted); font-weight: 500; }
.moto .ck { position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-radius: 10px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 26px; }
.fchips { display: flex; gap: 10px; }
.fchips span { padding: 8px 18px; border-radius: 999px; background: #eef1ff; font-weight: 700; color: var(--navy); font-size: 22px; }
.fchips span.on { background: var(--blue); color: #fff; }

/* statement */
.t-statement #text { top: 560px; }
.t-statement #text h1 { font-size: 104px; }
#dots { left: 70px; right: 70px; top: 1230px; height: 260px; }

/* steps overview */
.tl { position: relative; padding-left: 20px; }
.tl .it { display: flex; align-items: center; gap: 28px; margin-bottom: 24px; font-size: 42px; font-weight: 700; }
.tl .it b { flex: none; width: 96px; height: 96px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 36px; }
.tl::before { content: ''; position: absolute; left: 67px; top: 40px; bottom: 60px; width: 6px; border-radius: 3px; background: rgba(34,49,246,.2); }

/* single step scenes */
.t-step #text h1 { font-size: 100px; }
#scene { left: 70px; right: 70px; top: 1060px; height: 500px; }
.paper { position: absolute; left: 140px; right: 140px; top: 0; height: 460px; border-radius: 30px; background: #fff; box-shadow: 0 40px 80px -36px rgba(13,32,141,.55); padding: 40px; }
.paper .ln { height: 22px; border-radius: 11px; background: #e8ecff; margin-bottom: 22px; }
.paper .ln.b { background: var(--blue); width: 40%; }
.paper .stamp { position: absolute; right: 30px; bottom: 30px; padding: 14px 30px; border: 6px solid var(--ok); color: var(--ok); border-radius: 18px; font-size: 44px; font-weight: 800; letter-spacing: .08em; transform: rotate(-10deg); }
.paper .tick { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; margin-bottom: 20px; }
.paper .tick i { width: 46px; height: 46px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 26px; }
.bub { position: absolute; max-width: 700px; padding: 26px 32px; border-radius: 34px; font-size: 36px; font-weight: 600; line-height: 1.3; box-shadow: 0 24px 50px -30px rgba(13,32,141,.55); }
.bub.me { right: 0; background: var(--blue); color: #fff; border-bottom-right-radius: 10px; }
.bub.them { left: 0; background: #fff; border-bottom-left-radius: 10px; }
.call { position: absolute; inset: 0 60px; border-radius: 34px; background: var(--ink); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 22px; }
.call .p { border-radius: 24px; background: #26306a; display: grid; place-items: center; }
.call .p i { width: 140px; height: 140px; border-radius: 50%; background: var(--sky); }
.call .p:last-child i { background: var(--amber); }
.call .timer { position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); padding: 14px 30px; border-radius: 999px; background: #fff; color: var(--ink); font-size: 36px; font-weight: 800; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }

/* FAQ */
.t-faq #text { top: 400px; }
#chat { left: 70px; right: 70px; top: 600px; display: flex; flex-direction: column; gap: 46px; }
#chat .bub { position: relative; font-size: 52px; max-width: 860px; }
#chat .q { align-self: flex-end; }
#chat .ans { position: relative; align-self: flex-start; }
#chat .typing { position: absolute; left: 0; top: 0; display: flex; gap: 12px; padding: 34px 38px; border-radius: 34px; background: #fff; border-bottom-left-radius: 10px; }
#chat .typing i { width: 18px; height: 18px; border-radius: 50%; background: var(--muted); }
#chat .them { font-weight: 500; font-size: 48px; }

/* CTA */
.t-cta #text { top: 520px; }
.t-cta #text h1 { font-size: 112px; }
#cta { left: 70px; right: 70px; top: 1110px; }
#cta-btn { display: inline-flex; align-items: center; gap: 20px; padding: 34px 66px; border-radius: 999px; background: var(--amber); color: var(--ink); font-size: 54px; font-weight: 800; position: relative; }
#cta-btn .glow { position: absolute; inset: -16px; border-radius: 999px; border: 6px solid rgba(255,180,35,.5); }
.contact { display: flex; align-items: center; gap: 22px; margin-top: 34px; font-size: 42px; font-weight: 700; }
.contact i { width: 74px; height: 74px; border-radius: 22px; background: rgba(255,255,255,.12); display: grid; place-items: center; }
.contact i svg { width: 42px; height: 42px; }

/* Highlight cover */
#cover { display: none; position: absolute; inset: 0; background: var(--blue); }
body.cover #cover { display: grid; place-items: center; }
#cover .disc { width: 600px; height: 600px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--blue); }
#cover .disc svg, #cover .disc img { width: 300px; height: 300px; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>
  <svg id="flow" viewBox="0 0 1080 1920"><path class="fp" d=""/><path class="fp" d=""/></svg>
  <div id="darkbg"><div class="dgrid"></div><div class="dglow"></div><svg viewBox="0 0 1080 1920" style="position:absolute;inset:0"><path class="fp" d=""/><path class="fp" d=""/></svg></div>
  <div id="scenes"></div>
  <div id="tag" class="abs"></div>
  <img id="wm" src="assets/watermark-9x16.png" alt="">
  <div id="endbg"></div>
  <div id="end"><div class="eglow"></div><div class="emark"><div class="ering"></div><img src="assets/linea-mark.png" alt=""></div><div class="ename"></div><div class="eline"></div></div>
  <div id="sweep"><div class="edge a"></div><div class="band"></div><div class="edge b"></div><img src="assets/linea-mark.png" alt=""></div>
  <div id="cover"><div class="disc" id="cover-icon"></div></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>window.gsap || document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"><\/script>');</script>
<script src="stories.js"></script>
<script src="scenes.js"></script>
</body>
</html>
